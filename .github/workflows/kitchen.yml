---
name: Kitchen tests
on: [push, pull_request]
jobs:
  kitchen:
    runs-on: ubuntu-24.04
    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
    strategy:
      matrix:
        ansible:
          - 2.8.0
          - 2.8.18
          - 2.9.0
          - 2.9.16
          - 2.10.0
          - latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install ruby and ruby gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6
          bundler-cache: false

      - name: Install native extension build prerequisite and gems
        run: |
          gem install rake --version 13.2.1 --no-document
          bundle install

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Compatibility lane for the role's Ansible 2.8-2.10 test matrix.
          # Current Ansible/Python are covered by compatibility.yml.
          python-version: "3.8"

      - name: Login to Docker Hub when credentials are configured
        if: env.DOCKER_HUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Pacify CentOS 8.x
        run: |
          sudo mkdir -p /usr/libexec
          sudo ln -s /usr/bin/python /usr/libexec/platform-python

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install netaddr six 'jinja2<3.1' 'markupsafe<2.1'
          if [ "${{ matrix.ansible }}" == "latest" ] ; then
              pip install ansible
          else
              pip install ansible==${{ matrix.ansible }}
          fi

      - name: Show ansible version
        run: ansible --version

      - name: Run kitchen tests
        run: |
          mkdir -m 0700 -p .kitchen
          if ! [ -f ".kitchen/docker_id_rsa" ] ; then ssh-keygen -f .kitchen/docker_id_rsa -t rsa -N ''; fi
          bundle exec kitchen test default-centos-83

      - name: Show kitchen failure diagnostics
        if: failure()
        run: |
          for log in .kitchen/logs/*.log; do
            test ! -f "$log" || tail -n 100 "$log"
          done
