---
name: Validate Ansible
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate_ansible:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install ruby and ruby gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6
          bundler-cache: false

      - name: Install native extension build prerequisite and gems
        run: |
          gem install rake --version 13.2.1 --no-document
          bundle install

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Compatibility lane for the role's Ansible 2.8-2.10 test matrix.
          # Current Ansible/Python are covered by compatibility.yml.
          python-version: "3.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'ansible==2.10.7' 'ansible-base<2.11' 'ansible-lint==4.3.7' 'rich==10.12.0' yamllint netaddr six 'jinja2<3.1' 'markupsafe<2.1'

      - name: Show ansible version
        run: ansible --version

      - name: Run yamllint
        run: yamllint --config-file=tests/yamllint.yml meta tasks vars

      - name: Ensure an inspec test exists for each software installation
        run: |
          chmod +x tests/all_software_inspec_tested
          ./tests/all_software_inspec_tested

      - name: Check Ansible Galaxy lint
        run: |
          git clone https://github.com/ansible/galaxy-lint-rules.git
          ansible-lint -x 204,305 -r galaxy-lint-rules/rules .

      - name: Check playbook syntax
        run: ansible-playbook -i tests/inventory tests/playbooks/install_all.yml --syntax-check

      - name: Perform ansible-lint checks
        run: ansible-lint -x 204 tasks/*
